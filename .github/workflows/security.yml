name: Security

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Weekly, so that newly published advisories and queries reach an unchanged
  # tree too.
  schedule:
    - cron: "41 3 * * 4"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pure Go without cgo, so `go build ./...` works on a plain runner.
          # The workflows are audited by zizmor (make lint-actions).
          - language: go
            build-mode: autobuild
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          # The extractor builds the code itself: nothing to gain from a cache.
          cache: false
      - uses: github/codeql-action/init@v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@v4.39.3
        with:
          category: /language:${{ matrix.language }}

  # Known vulnerabilities of the dependencies and of the standard library
  # that capze can reach.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: make vuln
