name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Weekly, for what changes without a commit (Go patch releases, runner
  # images), and for a longer fuzz run.
  schedule:
    - cron: "23 2 * * 2"
  # The release workflow runs CI on the tagged commit before releasing it.
  workflow_call:
    inputs:
      ref:
        description: The commit to check, by default that of the event
        type: string
        default: ""
      release:
        description: >-
          Called by the release workflow: skip what can fail without a change
          of the code (fuzzing, the online workflow audits), which would leave
          a tag without a release.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # "ci" keeps the group apart from the caller's when called by the release
  # workflow (github.workflow is then the caller's name).
  group: ${{ github.workflow }}-ci-${{ github.event.pull_request.number || github.ref }}
  # Only a new push to a pull request cancels its previous run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The released platforms.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Test
        run: make test-race
      # As root, the tests bind-mount directories of their own to check that
      # nothing is deleted through a mount point (Linux only).
      - name: Test as root
        if: runner.os == 'Linux'
        run: make test-root
      - name: Build
        run: make build
      - name: Smoke test
        run: |
          set -x
          ./capze --version
          root=$(mktemp -d)
          mkdir "$root/app"
          for v in 1 2 3; do
            mkdir "$root/src"
            echo "$v" >"$root/src/version"
            ./capze deploy --keep 2 "$root/src" "$root/app"
          done
          test "$(cat "$root/app/current/version")" = 3
          test "$(./capze list "$root/app" | wc -l)" -eq 2
          ./capze rollback "$root/app"
          test "$(cat "$root/app/current/version")" = 2
          ./capze prune --keep 1 --dry-run "$root/app"
          ./capze prune --keep 1 "$root/app"
          ./capze list "$root/app"

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      # Same version as GOLANGCI_LINT_VERSION in the Makefile; bump together.
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: Vet for every released platform
        run: make vet
      - name: Build for every released platform
        run: make cross

  fuzz:
    name: fuzz
    if: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'schedule' && 30 || 15 }}
    env:
      # Per target: a smoke run on every change, a longer one on the schedule.
      FUZZTIME: ${{ github.event_name == 'schedule' && '5m' || '30s' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      # The seed corpora (f.Add and testdata/fuzz) also run with the unit
      # tests; this explores beyond them for a little while.
      - name: Fuzz every target
        run: make test-fuzz FUZZTIME="$FUZZTIME"
      # A failing input is written to testdata/fuzz/FuzzXxx of its package:
      # keep it, to reproduce the failure and add it as a regression seed.
      - name: Keep the failing inputs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
          retention-days: 30

  workflows:
    name: workflows
    if: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # For actionlint, which make runs with go run.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      # actionlint (syntax, expressions, shellcheck of the run steps) and
      # zizmor (template injection, excessive permissions, unpinned actions,
      # cache poisoning, ...), with the versions of the Makefile. The
      # read-only token lets zizmor run its online audits.
      - name: actionlint and zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: make lint-actions ZIZMOR_FLAGS=--format=github

  # Builds the archives and the packages exactly like the release workflow,
  # without publishing them: a broken release configuration is otherwise only
  # found when a tag is pushed.
  snapshot:
    name: release snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          # Like the release job: the assets do not depend on a cache.
          cache: false
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.20.0
          args: check
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.20.0
          args: release --snapshot --clean
      - name: Install the deb package
        run: |
          sudo apt-get install -y ./dist/capze_*_amd64.deb
          capze --version
          dpkg -L capze
          sudo apt-get remove -y capze
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: snapshot
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*checksums.txt
          retention-days: 7
