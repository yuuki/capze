name: release

# Releases a tag vX.Y.Z (or a pre-release such as vX.Y.Z-rc.1): CI runs on
# the tagged commit, then GoReleaser builds the archives and the packages and
# publishes the GitHub release, and the assets get a signed build provenance
# attestation.
#
# Running it by hand (workflow_dispatch) releases an existing tag again:
# after a failure, the assets already uploaded are replaced
# (release.replace_existing_artifacts in .goreleaser.yaml; the assets are
# reproducible).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to release (vX.Y.Z or vX.Y.Z-rc.N)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    # A reusable workflow called with ./ comes from the calling commit, as
    # $/ would bring nothing more (and actionlint does not know it yet).
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    with:
      ref: ${{ inputs.tag || github.ref }}
      release: true

  release:
    name: release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release and upload its assets
      id-token: write # get the Sigstore certificate that signs the attestation
      attestations: write # store the attestation
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          # GoReleaser derives the version and the release notes from the git
          # history, which a shallow clone would truncate.
          fetch-depth: 0
          # GoReleaser publishes through the API and never pushes with git.
          persist-credentials: false

      - name: The tag is a semantic version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a tag vX.Y.Z or vX.Y.Z-PRERELEASE"
            exit 1
          fi

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          # Published binaries are built without a cache another workflow run
          # could have written (cache poisoning).
          cache: false

      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.20.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}

      - name: List the subjects of the attestation
        # Every asset, and the checksums file itself.
        run: |
          checksums=$(ls dist/*_checksums.txt)
          cp "$checksums" "$RUNNER_TEMP/subjects.txt"
          (cd dist && sha256sum "$(basename "$checksums")") >>"$RUNNER_TEMP/subjects.txt"
          cat "$RUNNER_TEMP/subjects.txt"

      - uses: actions/attest@v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/subjects.txt
